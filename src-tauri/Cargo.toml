[package]
name = "niblit-ui"
version = "0.1.0"
description = "Niblit desktop shell"
authors = ["Niblit"]
edition = "2021"

[lib]
name = "niblit_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
